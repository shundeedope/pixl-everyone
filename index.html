<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="styles.css">
    <title>PIXL Everyone</title>
</head>
<body class="bg-pixl-dark text-pixl-light h-dvh w-full overflow-clip relative">
    <main class="relatitive z-10 p-4 pb-12">
        <div class="absolute inset-0 overflow-clip">
            <img 
                src="/images/Official-Login-BG.png" 
                alt=""
                class="absolute inset-y-0 left-[15%] h-full w-full object-cover mask-l-from-80% opacity-30"
            />
        </div>
    </main>
    <footer class="fixed bottom-0 inset-x-0 pb-3">
        <div class="flex flex-col items-center gap-1.5 pb-3 text-pixl p-4">
            <p class="text-pixel/50 text-sm">
                All rights reserved. Powered by Apollo For Everyone*
            </p>
            <p class="text-pixel/50 text-xs opacity-50">
                2026 version 1.0.0.0
            </p>
        </div>

        <!-- white-noise (repeating GIF) -->
         <div class="absolute bottom-0 inset-x-0 h-4 bg-[url('/public/images/white-noise.gif')]" ></div>
    </footer>
</body>
</html>
